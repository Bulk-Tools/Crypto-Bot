[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bot"
version = "0.1.0"
description = "Modular crypto research, signal, backtest, and paper-trading platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Crypto Bot Contributors"}]
dependencies = [
    "ccxt>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=17.0.0",
    "fastparquet>=2024.5.0",
]
ml = [
    "xgboost>=2.1.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
